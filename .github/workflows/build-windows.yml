# AROMA LOW LATENCY STUDIO — build na nuvem (GitHub Actions).
#
# Compila o AromaStudio (JUCE 8, MSVC) e o plugin VST3 (AromaVST3) no
# windows-latest e publica tudo como artefato e como release público
# (download sem login).
# O JUCE vem via FetchContent (baixado do GitHub durante o build).
# O EXE usa CRT estático: roda sem instalar o VC++ Redist.
#
# Disparo: push na main ou manual (Actions > Build Windows > Run workflow).
# Release: v0.5.0 — AromaStudio-v0.5.0-windows.zip (AromaStudio.exe +
# "Aroma Low Latency Studio.vst3" + kits + arte, pronto para rodar) e
# AromaStudio.exe avulso.

name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Os ativos binários (samples WAV + arte do kit) viajam no repo em
      # 35 partes base64 (tools/assets-bundle.tar.gz.b64.part-*), porque
      # o upload pelo conector só aceita texto e um arquivo único de
      # 3,4 MB não cabe num argumento de comando. Remonta os arquivos
      # exatos que o Allex validou na v0.3.2.
      - name: Restore binary assets
        shell: pwsh
        run: $out = [IO.File]::Create("tools/assets-bundle.tar.gz.b64"); Get-ChildItem tools/assets-bundle.tar.gz.b64.part-* | Sort-Object Name | ForEach-Object { $b = [IO.File]::ReadAllBytes($_.FullName); $out.Write($b, 0, $b.Length) }; $out.Close(); certutil -decode tools/assets-bundle.tar.gz.b64 assets-bundle.tar.gz; tar -xzf assets-bundle.tar.gz; Remove-Item assets-bundle.tar.gz

      - name: Configure (MSVC + JUCE via FetchContent)
        run: cmake -S . -B build -DAROMA_BUILD_JUCE_APP=ON -DAROMA_BUILD_VST3=ON

      - name: Build Release
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage deliverable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/AromaStudio.exe dist/
          Copy-Item build/Release/AromaStandalone.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/AromaDiagnostico.exe dist/ -ErrorAction SilentlyContinue
          # O pacote .vst3 do JUCE fica em <target>_artefacts/Release/VST3/
          # e o nome dele é o PRODUCT_NAME ("Aroma Low Latency Studio"),
          # não o nome do target (AromaVST3) — por isso o filtro é *.vst3.
          # Procura em vez de adivinhar o caminho, e falha se não existir.
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 | Select-Object -First 1
          if (-not $vst3) { throw "Nenhum pacote .vst3 encontrado em build/" }
          Copy-Item -Recurse $vst3.FullName dist/
          Copy-Item -Recurse kits dist/
          Copy-Item -Recurse assets dist/
          Compress-Archive -Path dist/* -DestinationPath AromaStudio-v0.5.0-windows.zip

      - name: Upload AromaStudio
        uses: actions/upload-artifact@v4
        with:
          name: AromaStudio-windows
          path: dist/
          if-no-files-found: error

      # Publica a release com a action oficial (mais confiável que o
      # `gh release create`: o comando gh falhou no run 45322074081 sem
      # deixar erro visível, e a release nunca foi criada).
      - name: Publish release v0.5.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: "v0.5.0 — AromaStudio (JUCE)"
          body: "AromaStudio.exe + plugin VST3 (Aroma Low Latency Studio.vst3) compilados na nuvem (MSVC + JUCE 8). ZIP pronto para rodar: EXE + VST3 + kits + arte do kit."
          files: |
            AromaStudio-v0.5.0-windows.zip
            build/Release/AromaStudio.exe
